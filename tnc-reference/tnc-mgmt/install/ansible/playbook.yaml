---
- name: Deploy OpenShift cluster via agent-based installer
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars.yaml

  vars:
    build_dir: "{{ playbook_dir }}/../build"
    dns_dir: "{{ playbook_dir }}/../dns"
    extra_manifests_dir: "{{ playbook_dir }}/../openshift/openshift"
    installer_binary: openshift-install
    raid_enabled: "{{ storage is defined and storage.os_disks is defined and storage.os_disks | length > 1 }}"
    disconnected: "{{ mirror_registry is defined }}"
    # Ignition spec version emitted in the RAID MachineConfig. 3.5.0 matches
    # OCP 4.19+; use 3.4.0 for 4.15-4.18.
    ignition_spec_version: "3.5.0"

  tasks:
    # --- Validation ---

    - name: Validate host count
      ansible.builtin.assert:
        that:
          - hosts | selectattr('role', 'equalto', 'master') | list | length == 3
          - hosts | selectattr('role', 'equalto', 'worker') | list | length >= 0
        fail_msg: "Exactly 3 master nodes are required"

    - name: Validate interface layout has bond0 interfaces
      ansible.builtin.assert:
        that:
          - interface_layout[item] | selectattr('bond', 'equalto', 'bond0') | list | length >= 1
        fail_msg: "interface_layout.{{ item }} must have at least one interface in bond0"
      loop: "{{ interface_layout | list }}"

    - name: Validate each host has correct number of MACs
      ansible.builtin.assert:
        that:
          - item.macs | length == interface_layout[item.role] | length
        fail_msg: "Host {{ item.hostname }} has {{ item.macs | length }} MACs but interface_layout.{{ item.role }} has {{ interface_layout[item.role] | length }} entries"
      loop: "{{ hosts }}"
      loop_control:
        label: "{{ item.hostname }}"

    - name: Validate BMC configuration
      ansible.builtin.assert:
        that:
          - bmc is defined
          - bmc.iso_url is defined
          - item.bmc_address is defined
          - item.bmc_username is defined
          - item.bmc_password is defined
        fail_msg: "BMC configuration incomplete for {{ item.hostname }}"
      loop: "{{ hosts }}"
      loop_control:
        label: "{{ item.hostname }}"

    # With more disks in the box than the OS uses (e.g. 2 OS + 2 ODF), a data
    # disk listed in os_disks would be repartitioned and wiped by the RAID
    # MachineConfig. Catch that here rather than on the hardware.
    - name: Validate OS disks are distinct and exclude data disks
      ansible.builtin.assert:
        that:
          - storage.os_disks | unique | length == storage.os_disks | length
          - storage.os_disks | intersect(item.data_disks | default([])) | length == 0
          - storage.os_disks | intersect((wipe | default({}, true)).data_disks | default([])) | length == 0
        fail_msg: >-
          storage.os_disks {{ storage.os_disks }} must contain no duplicates and
          must not overlap the data disks for {{ item.hostname }}
          ({{ item.data_disks | default((wipe | default({}, true)).data_disks | default([])) }}).
          Disks in os_disks are repartitioned and mirrored; everything else is
          left untouched.
        success_msg: >-
          {{ item.hostname }}: os_disks {{ storage.os_disks | join(', ') }} are
          distinct and exclude all data disks
      loop: "{{ hosts }}"
      loop_control:
        label: "{{ item.hostname }}"
      when: storage is defined and storage.os_disks is defined

    - name: Check if openshift-install is present
      ansible.builtin.command: "{{ installer_binary }} version"
      changed_when: false
      register: installer_check
      ignore_errors: true

    - name: Download openshift-install
      ansible.builtin.get_url:
        url: "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/{{ cluster.ocp_version }}/openshift-install-linux.tar.gz"
        dest: /tmp/openshift-install-linux.tar.gz
        mode: "0644"
      when: installer_check.rc != 0

    - name: Download OpenShift client (oc)
      ansible.builtin.get_url:
        url: "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/{{ cluster.ocp_version }}/openshift-client-linux.tar.gz"
        dest: /tmp/openshift-client-linux.tar.gz
        mode: "0644"
      when: installer_check.rc != 0

    - name: Install openshift-install
      ansible.builtin.unarchive:
        src: /tmp/openshift-install-linux.tar.gz
        dest: /usr/local/bin/
        remote_src: true
        mode: "0755"
      become: true
      when: installer_check.rc != 0

    - name: Install oc client
      ansible.builtin.unarchive:
        src: /tmp/openshift-client-linux.tar.gz
        dest: /usr/local/bin/
        remote_src: true
        mode: "0755"
      become: true
      when: installer_check.rc != 0

    - name: Verify openshift-install version
      ansible.builtin.command: "{{ installer_binary }} version"
      changed_when: false

    - name: Check required Ansible collections
      ansible.builtin.command: "ansible-galaxy collection list {{ item }}"
      changed_when: false
      register: collection_checks
      ignore_errors: true
      loop:
        - community.general
        - ansible.posix

    - name: Install missing Ansible collections
      ansible.builtin.command: "ansible-galaxy collection install {{ item.item }}"
      when: item.rc != 0
      loop: "{{ collection_checks.results }}"
      loop_control:
        label: "{{ item.item }}"

    # --- Prerequisites ---

    - name: Install prerequisites
      ansible.builtin.dnf:
        name:
          - httpd
          - nmstate
        state: present
        use_backend: dnf4
      become: true

    - name: Start and enable httpd
      ansible.builtin.systemd:
        name: httpd
        state: started
        enabled: true
      become: true

    - name: Open firewall for HTTP
      ansible.posix.firewalld:
        service: http
        permanent: true
        immediate: true
        state: enabled
      become: true

    # --- DNS Server ---

    - name: Create DNS config directory
      ansible.builtin.file:
        path: "{{ dns_dir }}"
        state: directory
        mode: "0755"

    - name: Generate named.conf
      ansible.builtin.template:
        src: templates/named.conf.j2
        dest: "{{ dns_dir }}/named.conf"
        mode: "0644"

    - name: Generate zone file
      ansible.builtin.template:
        src: templates/zone.db.j2
        dest: "{{ dns_dir }}/{{ cluster.name }}.{{ cluster.base_domain }}.zone"
        mode: "0644"

    - name: Ensure DNS files are readable by container (UID 65532)
      ansible.builtin.file:
        path: "{{ dns_dir }}"
        mode: "a+rX"
        recurse: true

    - name: Remove existing DNS container
      ansible.builtin.command: podman rm -f dns-server
      become: true
      changed_when: true
      ignore_errors: true

    - name: Open firewall for DNS
      ansible.posix.firewalld:
        service: dns
        permanent: true
        immediate: true
        state: enabled
      become: true

    - name: Start BIND DNS container
      ansible.builtin.command: >
        podman run -d --name dns-server
        --publish 53:8053/udp --publish 53:8053/tcp
        -v {{ dns_dir }}/named.conf:/etc/named/hbird-defaults.conf:ro,Z
        -v {{ dns_dir }}/{{ cluster.name }}.{{ cluster.base_domain }}.zone:/var/named/{{ cluster.name }}.{{ cluster.base_domain }}.zone:ro,Z
        registry.access.redhat.com/hi/bind:latest
      become: true

    - name: Wait for DNS to start
      ansible.builtin.pause:
        seconds: 5

    - name: Verify DNS resolves api record
      ansible.builtin.command: >
        dig +short api.{{ cluster.name }}.{{ cluster.base_domain }}
        @{{ networking.dns_servers[0] }}
      register: dns_check
      changed_when: false
      failed_when: networking.api_vip not in dns_check.stdout

    # --- Generate manifests ---

    - name: Clean build directory
      ansible.builtin.file:
        path: "{{ build_dir }}"
        state: absent

    - name: Create build directory
      ansible.builtin.file:
        path: "{{ build_dir }}/openshift"
        state: directory
        mode: "0750"

    - name: Generate install-config.yaml
      ansible.builtin.template:
        src: templates/install-config.yaml.j2
        dest: "{{ build_dir }}/install-config.yaml"
        mode: "0640"

    - name: Generate agent-config.yaml
      ansible.builtin.template:
        src: templates/agent-config.yaml.j2
        dest: "{{ build_dir }}/agent-config.yaml"
        mode: "0640"

    - name: Generate cluster network MTU manifest
      ansible.builtin.template:
        src: templates/cluster-network-mtu.yaml.j2
        dest: "{{ build_dir }}/openshift/cluster-network-mtu.yaml"
        mode: "0640"
      when: networking.mtu | default(1500) | int > 1500

    - name: Generate RAID mirror MachineConfig
      ansible.builtin.template:
        src: templates/raid-mirror.yaml.j2
        dest: "{{ build_dir }}/openshift/98-{{ item }}-raid1-mirror.yaml"
        mode: "0640"
      vars:
        role: "{{ item }}"
      loop: "{{ hosts | map(attribute='role') | unique | list }}"
      when: raid_enabled | bool

    # Regression guard for the defect that put every non-rendezvous control
    # plane node into an emergency shell: arrays declared with no filesystem on
    # them. A mirror is only bootable if md-root and md-boot are both formatted.
    # This is the safety net that makes a hand-maintained template defensible --
    # do not drop it.
    - name: Read the rendered RAID MachineConfig
      ansible.builtin.slurp:
        src: "{{ build_dir }}/openshift/98-{{ item }}-raid1-mirror.yaml"
      register: raid_mc_rendered
      loop: "{{ hosts | map(attribute='role') | unique | list }}"
      when: raid_enabled | bool

    - name: Confirm the MachineConfig formats both mirrored arrays
      ansible.builtin.assert:
        that:
          - mc_yaml.spec.config.storage.raid | map(attribute='name') | sort == ['md-boot', 'md-root']
          - "'/dev/md/md-root' in mc_fs_devices"
          - "'/dev/md/md-boot' in mc_fs_devices"
          - mc_yaml.spec.config.storage.disks | length == storage.os_disks | length
        fail_msg: >-
          {{ item.item }} RAID MachineConfig does not format both mirrored
          arrays. An array without a filesystem leaves dracut unable to find
          root, which drops the node into an emergency shell on first boot.
        success_msg: >-
          {{ item.item }}: md-root and md-boot both formatted across
          {{ storage.os_disks | length }} disks
      vars:
        mc_yaml: "{{ item.content | b64decode | from_yaml }}"
        mc_fs_devices: "{{ mc_yaml.spec.config.storage.filesystems | map(attribute='device') | list }}"
      loop: "{{ raid_mc_rendered.results }}"
      loop_control:
        label: "{{ item.item | default('') }}"
      when: raid_enabled | bool

    - name: Copy disconnected install manifests
      ansible.builtin.copy:
        src: "{{ extra_manifests_dir }}/"
        dest: "{{ build_dir }}/openshift/"
        mode: "0640"
      when: disconnected | bool

    # --- Generate ISO ---

    - name: Generate agent ISO
      ansible.builtin.command: "{{ installer_binary }} --dir {{ build_dir }} agent create image"

    - name: Copy ISO to HTTP server
      ansible.builtin.copy:
        src: "{{ build_dir }}/agent.x86_64.iso"
        dest: "{{ bmc.iso_server_path }}/agent.x86_64.iso"
        remote_src: true
        mode: "0644"
      become: true
      when: bmc.iso_server_path is defined

    # --- Boot nodes via Redfish ---

    - name: Display deployment summary
      ansible.builtin.debug:
        msg:
          - "Cluster: {{ cluster.name }}.{{ cluster.base_domain }}"
          - "Masters: {{ hosts | selectattr('role', 'equalto', 'master') | list | length }}"
          - "Workers: {{ hosts | selectattr('role', 'equalto', 'worker') | list | length }}"
          - "API VIP: {{ networking.api_vip }}"
          - "Ingress VIP: {{ networking.ingress_vip }}"
          - "RAID: {{ 'enabled (' + storage.os_disks | join(' + ') + ')' if raid_enabled | bool else 'disabled' }}"
          - "ISO: {{ bmc.iso_url }}"
          - "Booting {{ hosts | length }} nodes..."

    - name: Power off nodes
      community.general.redfish_command:
        baseuri: "{{ item.bmc_address }}"
        username: "{{ item.bmc_username }}"
        password: "{{ item.bmc_password }}"
        category: Systems
        command: PowerForceOff
      loop: "{{ hosts }}"
      loop_control:
        label: "{{ item.hostname }}"
      ignore_errors: true

    - name: Wait for nodes to power off
      ansible.builtin.pause:
        seconds: 10

    - name: Eject existing virtual media
      community.general.redfish_command:
        baseuri: "{{ item.bmc_address }}"
        username: "{{ item.bmc_username }}"
        password: "{{ item.bmc_password }}"
        category: Manager
        command: VirtualMediaEject
        virtual_media:
          image_url: "{{ bmc.iso_url }}"
      loop: "{{ hosts }}"
      loop_control:
        label: "{{ item.hostname }}"
      ignore_errors: true

    - name: Insert agent ISO via virtual media
      community.general.redfish_command:
        baseuri: "{{ item.bmc_address }}"
        username: "{{ item.bmc_username }}"
        password: "{{ item.bmc_password }}"
        category: Manager
        command: VirtualMediaInsert
        virtual_media:
          image_url: "{{ bmc.iso_url }}"
          media_types:
            - CD
            - DVD
      loop: "{{ hosts }}"
      loop_control:
        label: "{{ item.hostname }}"

    - name: Set boot override to virtual CD
      ansible.builtin.uri:
        url: "https://{{ item.bmc_address }}/redfish/v1/Systems/1"
        method: PATCH
        user: "{{ item.bmc_username }}"
        password: "{{ item.bmc_password }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Content-Type: application/json
        body_format: json
        body:
          Boot:
            BootSourceOverrideTarget: UsbCd
            BootSourceOverrideEnabled: Continuous
            BootSourceOverrideMode: UEFI
      loop: "{{ hosts }}"
      loop_control:
        label: "{{ item.hostname }}"

    - name: Power on nodes
      community.general.redfish_command:
        baseuri: "{{ item.bmc_address }}"
        username: "{{ item.bmc_username }}"
        password: "{{ item.bmc_password }}"
        category: Systems
        command: PowerOn
      loop: "{{ hosts }}"
      loop_control:
        label: "{{ item.hostname }}"

    # --- Wait for installation ---

    - name: Wait for bootstrap to complete
      ansible.builtin.command: >
        {{ installer_binary }} --dir {{ build_dir }}
        agent wait-for bootstrap-complete --log-level=info
      timeout: 3600

    - name: Clear boot override
      ansible.builtin.uri:
        url: "https://{{ item.bmc_address }}/redfish/v1/Systems/1"
        method: PATCH
        user: "{{ item.bmc_username }}"
        password: "{{ item.bmc_password }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Content-Type: application/json
        body_format: json
        body:
          Boot:
            BootSourceOverrideTarget: None
            BootSourceOverrideEnabled: Disabled
      loop: "{{ hosts }}"
      loop_control:
        label: "{{ item.hostname }}"

    - name: Eject virtual media
      community.general.redfish_command:
        baseuri: "{{ item.bmc_address }}"
        username: "{{ item.bmc_username }}"
        password: "{{ item.bmc_password }}"
        category: Manager
        command: VirtualMediaEject
        virtual_media:
          image_url: "{{ bmc.iso_url }}"
      loop: "{{ hosts }}"
      loop_control:
        label: "{{ item.hostname }}"
      ignore_errors: true

    - name: Wait for install to complete
      ansible.builtin.command: >
        {{ installer_binary }} --dir {{ build_dir }}
        agent wait-for install-complete
      timeout: 3600

    - name: Installation complete
      ansible.builtin.debug:
        msg:
          - "Cluster {{ cluster.name }}.{{ cluster.base_domain }} deployed successfully"
          - "Kubeconfig: {{ build_dir }}/auth/kubeconfig"
          - "Run: export KUBECONFIG={{ build_dir }}/auth/kubeconfig"

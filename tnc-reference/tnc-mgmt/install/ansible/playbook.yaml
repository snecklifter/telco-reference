---
- name: Install OpenShift cluster via agent-based installer
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [install]

  vars_files:
    - "{{ cluster_vars | default('vars.yaml') }}"

  vars:
    build_dir: "{{ playbook_dir }}/../build"
    dns_dir: /opt/dns
    extra_manifests_dir: "{{ playbook_dir }}/../openshift/openshift"
    kubeconfig_path: "{{ build_dir }}/auth/kubeconfig"
    installer_binary: openshift-install
    raid_enabled: "{{ storage is defined and storage.os_disks is defined and storage.os_disks | length > 1 }}"
    disconnected: "{{ mirror_registry is defined }}"
    ignition_spec_version: "3.5.0"

  roles:
    - role: backup
      tags: [install, backup]
    - bmc_harden
    - validate
    - prerequisites
    - dns
    - manifests
    - boot

- name: Configure OpenShift cluster (day-2)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [configure]

  vars_files:
    - "{{ cluster_vars | default('vars.yaml') }}"

  vars:
    build_dir: "{{ playbook_dir }}/../build"
    config_src_dir: "{{ playbook_dir }}/../../configuration"
    config_stage_dir: "{{ build_dir }}/configuration"
    kubeconfig_path: "{{ build_dir }}/auth/kubeconfig"
    installer_binary: openshift-install
    disconnected: "{{ mirror_registry is defined }}"

  roles:
    - stage_config
    - storage
    - cluster_dns
    - vault
    - certmanager
    - keycloak
    - netbox
    - aap
    - gitlab
    - gitops

---
cluster:
  name: mgmt1
  base_domain: example.com
  ocp_version: stable-4.22

networking:
  cluster_network_cidr: 10.128.0.0/14
  cluster_network_host_prefix: 23
  machine_network_cidr: 172.31.61.0/24
  service_network_cidr: 172.30.0.0/16
  api_vip: 172.31.61.4
  ingress_vip: 172.31.61.5

  mtu: 8950
  bond_mode: "802.3ad"
  bond_miimon: "1000"

  # Uncomment to use a VLAN sub-interface on bond0
  # vlan_id: 61

  storage_network:
    vlan_id: 62
    cidr: 172.31.62.0/24

  dns_servers:
    - 192.0.2.4
  default_gateway: 172.31.61.1

  # NTP sources (omit to use default Red Hat NTP pool)
  # ntp_sources:
  #   - ntp1.example.com
  #   - ntp2.example.com

# Full boot-disk RAID 1 mirror (ESP + /boot + root) across these disks, so a
# single disk failure does not take the node down. List one disk to disable
# mirroring entirely. Rendered by templates/raid-mirror.yaml.j2 into a day-1
# MachineConfig -- mirroring cannot be added to an already-installed node.
#
# ONLY the disks listed here are partitioned, wiped and mirrored. Every other
# disk in the machine (ODF/data disks) is left completely untouched -- it is
# never referenced by the MachineConfig. On a 4-disk node, list just the two OS
# disks here and leave the data disks out. The playbook asserts that os_disks
# contains no duplicates and does not overlap any data_disks.
storage:
  os_disks:
    - /dev/nvme0n1
    - /dev/nvme1n1


# Disk wiping for a fresh install -- used ONLY by wipe-disks.yaml, never by
# playbook.yaml. Destroys all data on the disks below.
#
#   ansible-playbook wipe-disks.yaml
#
# `enabled` declares intent; the playbook additionally requires the operator to
# type the cluster name at runtime and refuses to run while the cluster API or
# any node still answers. Re-arm the gate by setting this back to false once the
# rebuild is done.
wipe:
  enabled: false

  # Extra disks to wipe in addition to storage.os_disks -- e.g. ODF disks on a
  # rebuild. Empty means the wipe touches ONLY the OS disks and leaves data
  # disks alone, which is what you want unless you are deliberately discarding
  # ODF data. Override per host with a `data_disks:` key on the host entry.
  data_disks: []

  # Issue blkdiscard after zapping. Fast and thorough on NVMe/SSD; set false
  # for disks that do not support discard.
  discard: true

  # Live environment used to perform the wipe. Must be the agent ISO: it carries
  # the static network config that makes each node reachable at its host.ip.
  # Defaults to bmc.iso_url.
  # iso_url: http://bastion.example.com:8080/agent.x86_64.iso

  # SSH identity for the `core` user in the live environment. Must match the
  # public key in `ssh_key` below. Defaults to the Ansible/SSH default identity.
  # ssh_private_key: ~/.ssh/id_rsa

# Uncomment for disconnected installs with a local mirror registry
# mirror_registry:
#   url: registry.bastion.example.com:9500
#   release_path: ocp/ocp4/openshift/release
#   release_images_path: ocp/ocp4/openshift/release-images
#   ca_bundle: |
#     -----BEGIN CERTIFICATE-----
#     REDACTED
#     -----END CERTIFICATE-----

# Day-2 configuration — all values consumed by the "Configure" phase of
# playbook.yaml. Overlay files in the repo are never modified; the playbook
# copies the configuration tree to a staging area, templates patches there,
# and applies with kustomize build.
configuration:
  # Components to include in kustomization.yaml. Comment out any line to
  # exclude that component entirely.
  components:
    - talm
    - lso
    - odf
    - gitops
    - acm
    - vault
    - quay
    - logging
    - cnv
    # - registry        # disconnected only
    # - kafka
    # - monitoring-kafka
    # - gitops-ztp

  # Operator catalog source — connected clusters use redhat-operators;
  # disconnected use redhat-operators-disconnected (must match your CatalogSource)
  catalog_source: redhat-operators

  # Subscription channel overrides — the reference CRs pin channels for
  # disconnected catalogs that may differ from the connected catalog.
  # Map operator package name to the channel available in your catalog.
  # Omit an operator to keep the channel from the reference CR unchanged.
  channel_overrides:
    odf-operator: stable-4.22
    # local-storage-operator: stable
    # openshift-gitops-operator: gitops-1.20
    # advanced-cluster-management: release-2.17
    # cluster-logging: stable-6.6

  # cert-manager — wildcard TLS via Let's Encrypt DNS-01 challenge.
  # The webhook solver image and solver/group names are provider-specific;
  # set them to match whatever DNS webhook you deploy.
  certmanager:
    email: REDACTED
    dns_provider:
      api_url: https://REDACTED/v0
      username: REDACTED
      password: REDACTED
    webhook:
      image: REDACTED
      image_tag: latest
      group_name: REDACTED
      solver_name: REDACTED

  # GitLab instance deployed on this cluster (before ArgoCD, needs ODF)
  # Chart version must match the gitlab-operator version — check with:
  #   oc -n gitlab-system get csv -o jsonpath='{.items[0].spec.version}'
  gitlab:
    chart_version: "10.1.8"
    group: telco
    project: telco-reference
    replicas: 3
    pages_subdomain: docs
    registry_enabled: false
    keycloak_enabled: false
    postgres:
      image: registry.redhat.io/rhel9/postgresql-18
      image_tag: "latest"
      storage_size: "10Gi"
      storage_class: ocs-storagecluster-ceph-rbd
    psql:
      host: gitlab-postgres-rw
      port: 5432
      database: gitlabhq_production
      username: gitlab
      secret: gitlab-postgres-app-secret
      secret_key: password
    redis_deployment:
      image: registry.redhat.io/rhel9/redis-7
      image_tag: "latest"
    redis:
      host: gitlab-redis
      secret: gitlab-redis-secret-custom
      secret_key: default
    backup_schedule: "0 1 * * *"

  # Git repo for ArgoCD to sync from (auto-populated from GitLab config above)
  gitops:
    branch: tnc7.0-release-4.22

  # ODF / LSO storage on worker nodes
  odf:
    disk_paths:
      - /dev/nvme2n1
      - /dev/nvme3n1
      - /dev/nvme4n1
      - /dev/nvme5n1
      - /dev/nvme6n1
    storage_size: "3500Gi"
    storage_class: local-sc
    default_storage_class: ocs-storagecluster-ceph-rbd
    filesystem_storage_class: ocs-storagecluster-cephfs

  # ACM AgentServiceConfig — OS images for spoke cluster provisioning
  acm:
    os_images:
      - cpu_architecture: x86_64
        openshift_version: "4.22"
        rootfs_url: https://mirror.openshift.com/pub/openshift-v4/x86_64/dependencies/rhcos/4.22/latest/rhcos-live-rootfs.x86_64.img
        iso_url: https://mirror.openshift.com/pub/openshift-v4/x86_64/dependencies/rhcos/4.22/latest/rhcos-live.x86_64.iso
        version: "9.8.20260428-0"

  # Vault Enterprise — server deployment (Helm) and ClusterSecretStore config.
  # External access uses GatewayAPI HTTPRoute. API listener runs HTTP;
  # the gateway handles external TLS.
  vault:
    chart_version: "0.34.1"
    image: hashicorp/vault-enterprise
    image_tag: "2.0.3-ent-ubi"
    replicas: 3
    storage_class: ocs-storagecluster-ceph-rbd
    data_storage_size: "10Gi"
    audit_storage_size: "5Gi"
    license: "REDACTED"
    injector_image: hashicorp/vault-k8s
    injector_image_tag: "1.7.6-ubi"
    injector_replicas: 2
    key_shares: 5
    key_threshold: 3
    mount_path: kubernetes-mgmt1
    role: mgmt1
    secret_path: ztp/mgmt1
    # CA bundle — uncomment and paste when Vault uses a private CA
    # ca_bundle: |
    #   -----BEGIN CERTIFICATE-----
    #   REDACTED
    #   -----END CERTIFICATE-----

bmc:
  iso_url: http://bastion.example.com:8080/agent.x86_64.iso
  iso_server_path: /var/www/html

pull_secret: '{"auths":{"cloud.openshift.com":{"auth":"REDACTED","email":"user@redhat.com"}}}'

ssh_key: |
  ssh-rsa AAAAB3NzaC1yc2EA...


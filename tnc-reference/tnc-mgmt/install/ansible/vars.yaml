---
cluster:
  name: mgmt1
  base_domain: example.com

networking:
  cluster_network_cidr: 10.128.0.0/14
  cluster_network_host_prefix: 23
  machine_network_cidr: 172.31.61.0/24
  service_network_cidr: 172.30.0.0/16
  api_vip: 172.31.61.4
  ingress_vip: 172.31.61.5

  mtu: 8950
  prefix_length: 24
  bond_mode: "802.3ad"
  bond_miimon: "1000"

  # Uncomment to use a VLAN sub-interface on bond0
  # vlan_id: 61

  dns_servers:
    - 192.0.2.4
  default_gateway: 172.31.61.1

# RAID 1 boot mirror across two OS disks (omit for single disk)
storage:
  os_disks:
    - /dev/nvme0n1
    - /dev/nvme1n1

# Uncomment for disconnected installs with a local mirror registry
# mirror_registry:
#   url: registry.bastion.example.com:9500
#   release_path: ocp/ocp4/openshift/release
#   release_images_path: ocp/ocp4/openshift/release-images
#   ca_bundle: |
#     -----BEGIN CERTIFICATE-----
#     REDACTED
#     -----END CERTIFICATE-----

bmc:
  username: admin
  password: REDACTED
  iso_url: http://bastion.example.com:8080/agent.x86_64.iso

pull_secret: '{"auths":{"cloud.openshift.com":{"auth":"REDACTED","email":"user@redhat.com"}}}'

ssh_key: |
  ssh-rsa AAAAB3NzaC1yc2EA...

interface_layout:
  - name: eno12399
    bond: bond0
  - name: eno12409
    bond: bond0
  - name: eno12419
    bond: bond1
  - name: eno12429
    bond: bond1

hosts:
  - hostname: control-0
    role: master
    ip: 172.31.61.6
    bmc_address: 192.168.1.100
    macs:
      - "30:3E:A7:03:04:70"
      - "30:3E:A7:03:04:71"
      - "30:3E:A7:03:04:72"
      - "30:3E:A7:03:04:73"

  - hostname: control-1
    role: master
    ip: 172.31.61.7
    bmc_address: 192.168.1.101
    macs:
      - "30:3E:A7:02:FD:C0"
      - "30:3E:A7:02:FD:C1"
      - "30:3E:A7:02:FD:C2"
      - "30:3E:A7:02:FD:C3"

  - hostname: control-2
    role: master
    ip: 172.31.61.8
    bmc_address: 192.168.1.102
    macs:
      - "30:3E:A7:03:0A:40"
      - "30:3E:A7:03:0A:41"
      - "30:3E:A7:03:0A:42"
      - "30:3E:A7:03:0A:43"

  - hostname: worker-0
    role: worker
    ip: 172.31.61.9
    bmc_address: 192.168.1.103
    macs:
      - "AA:BB:CC:DD:EE:01"
      - "AA:BB:CC:DD:EE:02"
      - "AA:BB:CC:DD:EE:03"
      - "AA:BB:CC:DD:EE:04"

  - hostname: worker-1

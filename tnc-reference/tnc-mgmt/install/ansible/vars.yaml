---
cluster:
  name: mgmt1
  base_domain: example.com

networking:
  cluster_network_cidr: 10.128.0.0/14
  cluster_network_host_prefix: 23
  machine_network_cidr: 172.31.61.0/24
  service_network_cidr: 172.30.0.0/16
  api_vip: 172.31.61.4
  ingress_vip: 172.31.61.5

  mtu: 8950
  prefix_length: 24
  bond_mode: "802.3ad"
  bond_miimon: "1000"

  # Uncomment to use a VLAN sub-interface on bond0
  # vlan_id: 61

  dns_servers:
    - 192.0.2.4
  default_gateway: 172.31.61.1

# Uncomment for disconnected installs with a local mirror registry
# mirror_registry:
#   url: registry.bastion.example.com:9500
#   release_path: ocp/ocp4/openshift/release
#   release_images_path: ocp/ocp4/openshift/release-images
#   ca_bundle: |
#     -----BEGIN CERTIFICATE-----
#     REDACTED
#     -----END CERTIFICATE-----

pull_secret: '{"auths":{"cloud.openshift.com":{"auth":"REDACTED","email":"user@redhat.com"}}}'

ssh_key: |
  ssh-rsa AAAAB3NzaC1yc2EA...


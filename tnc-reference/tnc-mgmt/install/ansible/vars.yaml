---
cluster:
  name: mgmt1
  base_domain: example.com
  ocp_version: stable-4.22

networking:
  cluster_network_cidr: 10.128.0.0/14
  cluster_network_host_prefix: 23
  machine_network_cidr: 172.31.61.0/24
  service_network_cidr: 172.30.0.0/16
  api_vip: 172.31.61.4
  ingress_vip: 172.31.61.5

  mtu: 8950
  bond_mode: "802.3ad"
  bond_miimon: "1000"

  # Uncomment to use a VLAN sub-interface on bond0
  # vlan_id: 61

  storage_network:
    vlan_id: 62
    cidr: 172.31.62.0/24

  dns_servers:
    - 192.0.2.4
  default_gateway: 172.31.61.1

# Full boot-disk RAID 1 mirror (ESP + /boot + root) across these disks, so a
# single disk failure does not take the node down. List one disk to disable
# mirroring entirely. Rendered by templates/raid-mirror.yaml.j2 into a day-1
# MachineConfig -- mirroring cannot be added to an already-installed node.
#
# ONLY the disks listed here are partitioned, wiped and mirrored. Every other
# disk in the machine (ODF/data disks) is left completely untouched -- it is
# never referenced by the MachineConfig. On a 4-disk node, list just the two OS
# disks here and leave the data disks out. The playbook asserts that os_disks
# contains no duplicates and does not overlap any data_disks.
storage:
  os_disks:
    - /dev/nvme0n1
    - /dev/nvme1n1


# Disk wiping for a fresh install -- used ONLY by wipe-disks.yaml, never by
# playbook.yaml. Destroys all data on the disks below.
#
#   ansible-playbook wipe-disks.yaml
#
# `enabled` declares intent; the playbook additionally requires the operator to
# type the cluster name at runtime and refuses to run while the cluster API or
# any node still answers. Re-arm the gate by setting this back to false once the
# rebuild is done.
wipe:
  enabled: false

  # Extra disks to wipe in addition to storage.os_disks -- e.g. ODF disks on a
  # rebuild. Empty means the wipe touches ONLY the OS disks and leaves data
  # disks alone, which is what you want unless you are deliberately discarding
  # ODF data. Override per host with a `data_disks:` key on the host entry.
  data_disks: []

  # Issue blkdiscard after zapping. Fast and thorough on NVMe/SSD; set false
  # for disks that do not support discard.
  discard: true

  # Live environment used to perform the wipe. Must be the agent ISO: it carries
  # the static network config that makes each node reachable at its host.ip.
  # Defaults to bmc.iso_url.
  # iso_url: http://bastion.example.com:8080/agent.x86_64.iso

  # SSH identity for the `core` user in the live environment. Must match the
  # public key in `ssh_key` below. Defaults to the Ansible/SSH default identity.
  # ssh_private_key: ~/.ssh/id_rsa

# Uncomment for disconnected installs with a local mirror registry
# mirror_registry:
#   url: registry.bastion.example.com:9500
#   release_path: ocp/ocp4/openshift/release
#   release_images_path: ocp/ocp4/openshift/release-images
#   ca_bundle: |
#     -----BEGIN CERTIFICATE-----
#     REDACTED
#     -----END CERTIFICATE-----

bmc:
  iso_url: http://bastion.example.com:8080/agent.x86_64.iso
  iso_server_path: /var/www/html

pull_secret: '{"auths":{"cloud.openshift.com":{"auth":"REDACTED","email":"user@redhat.com"}}}'

ssh_key: |
  ssh-rsa AAAAB3NzaC1yc2EA...

interface_layout:
  master:
    - name: eno12399
      bond: bond0
    - name: eno12409
      bond: bond0
    - name: eno12419
      bond: bond1
    - name: eno12429
      bond: bond1
  worker:
    - name: ens1f0np0
      bond: bond0
    - name: ens1f1np1
      bond: bond0
    - name: ens2f0np0
      bond: bond1
    - name: ens2f1np1
      bond: bond1


---
- name: Check installed openshift-install version
  ansible.builtin.command: "{{ installer_binary }} version"
  register: installer_local
  changed_when: false
  failed_when: false

- name: Get local version
  ansible.builtin.set_fact:
    local_ocp_version: "{{ (installer_local.stdout | default('') | regex_search('v([0-9]+\\.[0-9]+\\.[0-9]+)', '\\1'))[0] | default('none') }}"

- name: Check latest available version for channel
  ansible.builtin.uri:
    url: "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/{{ cluster.ocp_version }}/release.txt"
    return_content: true
  register: release_info

- name: Get remote version
  ansible.builtin.set_fact:
    remote_ocp_version: "{{ release_info.content | regex_search('Version:\\s+([0-9]+\\.[0-9]+\\.[0-9]+)', '\\1') | first }}"

- name: Report version check
  ansible.builtin.debug:
    msg: "{{ 'Update available: ' + local_ocp_version + ' → ' + remote_ocp_version if local_ocp_version != remote_ocp_version else 'Up to date: ' + local_ocp_version }}"

- name: Download openshift-install
  ansible.builtin.get_url:
    url: "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/{{ cluster.ocp_version }}/openshift-install-linux.tar.gz"
    dest: /tmp/openshift-install-linux.tar.gz
    mode: "0644"
    force: true
  when: local_ocp_version != remote_ocp_version

- name: Download OpenShift client (oc)
  ansible.builtin.get_url:
    url: "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/{{ cluster.ocp_version }}/openshift-client-linux.tar.gz"
    dest: /tmp/openshift-client-linux.tar.gz
    mode: "0644"
    force: true
  when: local_ocp_version != remote_ocp_version

- name: Install openshift-install
  ansible.builtin.unarchive:
    src: /tmp/openshift-install-linux.tar.gz
    dest: /usr/local/bin/
    remote_src: true
    mode: "0755"
  become: true
  when: local_ocp_version != remote_ocp_version

- name: Install oc client
  ansible.builtin.unarchive:
    src: /tmp/openshift-client-linux.tar.gz
    dest: /usr/local/bin/
    remote_src: true
    mode: "0755"
  become: true
  when: local_ocp_version != remote_ocp_version

- name: Verify openshift-install version
  ansible.builtin.command: "{{ installer_binary }} version"
  changed_when: false

- name: Check required Ansible collections
  ansible.builtin.command: "ansible-galaxy collection list {{ item }}"
  changed_when: false
  register: collection_checks
  ignore_errors: true
  loop:
    - community.general
    - ansible.posix

- name: Install missing Ansible collections
  ansible.builtin.command: "ansible-galaxy collection install {{ item.item }}"
  when: item.rc != 0
  loop: "{{ collection_checks.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Check if helm is present
  ansible.builtin.command: helm version --short
  changed_when: false
  register: helm_check
  ignore_errors: true

- name: Install helm
  ansible.builtin.shell: >
    curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  become: true
  when: helm_check.rc != 0

- name: Install prerequisites
  ansible.builtin.dnf:
    name:
      - httpd
      - nmstate
    state: present
    use_backend: dnf4
  become: true

- name: Start and enable httpd
  ansible.builtin.systemd:
    name: httpd
    state: started
    enabled: true
  become: true

- name: Open firewall for HTTP
  ansible.posix.firewalld:
    service: http
    permanent: true
    immediate: true
    state: enabled
  become: true

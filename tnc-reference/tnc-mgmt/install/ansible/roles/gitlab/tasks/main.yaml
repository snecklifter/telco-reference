---
- name: Render GitLab manifests
  ansible.builtin.template:
    src: "configuration/{{ item.src }}"
    dest: "{{ config_stage_dir }}/{{ item.dest }}"
    mode: "0644"
  loop:
    - src: gitlab-namespace.yaml.j2
      dest: gitlab-namespace.yaml
    - src: gitlab-subscription.yaml.j2
      dest: gitlab-subscription.yaml
    - src: gitlab-cr.yaml.j2
      dest: gitlab-cr.yaml
    - src: gitlab-routes.yaml.j2
      dest: gitlab-routes.yaml
    - src: gitlab-external-secrets.yaml.j2
      dest: gitlab-external-secrets.yaml
  loop_control:
    label: "{{ item.dest }}"

- name: Install GitLab operator
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }} apply
    -f {{ config_stage_dir }}/gitlab-namespace.yaml
    -f {{ config_stage_dir }}/gitlab-subscription.yaml

- name: Deploy GitLab prerequisites (NooBaa, S3, Vault secrets, PostgreSQL, Redis)
  ansible.builtin.include_tasks: prerequisites.yaml

- name: Wait for GitLab operator
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n gitlab-system get subscriptions.operators.coreos.com
    gitlab-operator-kubernetes -o jsonpath='{.status.state}'
  register: gitlab_op_state
  until: gitlab_op_state.stdout == "AtLatestKnown"
  retries: 30
  delay: 20
  changed_when: false

- name: Wait for GitLab CRD
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    get crd gitlabs.apps.gitlab.com
  register: gitlab_crd
  until: gitlab_crd.rc == 0
  retries: 30
  delay: 10
  changed_when: false

- name: Wait for GitLab controller manager service
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n gitlab-system get service gitlab-controller-manager-service
  register: gitlab_svc
  until: gitlab_svc.rc == 0
  retries: 30
  delay: 10
  changed_when: false

- name: Detect GitLab operator chart version
  ansible.builtin.shell: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n gitlab-system get csv -o json |
    python3 -c "import json,sys; csvs=json.load(sys.stdin)['items'];
    gl=[c for c in csvs if 'gitlab' in c['metadata']['name'].lower()];
    examples=json.loads(gl[0]['metadata']['annotations']['alm-examples']);
    print(examples[0]['spec']['chart']['version'])"
  register: gitlab_csv_version
  changed_when: false

- name: Re-render GitLab CR with operator chart version
  ansible.builtin.template:
    src: configuration/gitlab-cr.yaml.j2
    dest: "{{ config_stage_dir }}/gitlab-cr.yaml"
    mode: "0644"
  vars:
    gitlab_chart_version: "{{ gitlab_csv_version.stdout }}"

- name: Create GitLab instance
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    apply -f {{ config_stage_dir }}/gitlab-cr.yaml

- name: Create GitLab Routes
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    apply -f {{ config_stage_dir }}/gitlab-routes.yaml

- name: Wait for GitLab to be running
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n gitlab-system get gitlab gitlab
    -o jsonpath='{.status.phase}'
  register: gitlab_phase
  until: gitlab_phase.stdout == "Running"
  retries: 60
  delay: 30
  changed_when: false

# --- Initialize GitLab (user, repo, push) ---

# The configuration tree reaches the reference CRs through a reference-crs
# symlink into the telco-reference submodule, so ArgoCD cannot render the app
# without the submodule content. The committed .gitmodules points at
# git@github.com, which the repo-server can neither authenticate nor reach --
# it blocks on the SSH connect until manifest generation hits its deadline and
# reports "context deadline exceeded". ArgoCD also runs submodule fetches with
# the *parent* repository's credentials, so registering the submodule as its
# own repository in ArgoCD has no effect. Mirror the submodule into GitLab
# alongside the superproject and rewrite the URLs at push time, so both clones
# are the same host with the same credentials.
- name: Set GitLab facts
  ansible.builtin.set_fact:
    gitlab_host: "gitlab.apps.{{ cluster.name }}.{{ cluster.base_domain }}"
    gitlab_repo_url: "https://gitlab.apps.{{ cluster.name }}.{{ cluster.base_domain }}/{{ configuration.gitlab.group }}/{{ configuration.gitlab.project }}.git"
    gitlab_submodule_repo_url: "https://gitlab.apps.{{ cluster.name }}.{{ cluster.base_domain }}/{{ configuration.gitlab.group }}/{{ configuration.gitlab.submodule_project }}.git"
    repo_root: "{{ (playbook_dir ~ '/../../../..') | realpath }}"
    gitlab_push_worktree: "{{ build_dir }}/gitlab-push"

- name: Set GitLab push paths
  ansible.builtin.set_fact:
    config_rel_dir: "{{ (config_src_dir | realpath) | relpath(repo_root) }}"

- name: Wait for GitLab API
  ansible.builtin.uri:
    url: "https://{{ gitlab_host }}/api/v4/version"
    validate_certs: false
    status_code: [200, 401]
  register: gitlab_api
  until: gitlab_api.status in [200, 401]
  retries: 30
  delay: 20

- name: Create automation PAT via GitLab Rails runner
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n gitlab-system exec deploy/gitlab-toolbox --
    gitlab-rails runner "
      user = User.find(1);
      user.personal_access_tokens.active.where(name: 'ansible-automation').each(&:revoke!);
      token = user.personal_access_tokens.create!(
        name: 'ansible-automation',
        scopes: ['api', 'write_repository'],
        expires_at: 365.days.from_now
      );
      puts token.token
    "
  register: gitlab_pat_result
  no_log: true

- name: Set PAT fact
  ansible.builtin.set_fact:
    gitlab_pat: "{{ gitlab_pat_result.stdout_lines[-1] }}"
  no_log: true

- name: Create GitLab group
  ansible.builtin.uri:
    url: "https://{{ gitlab_host }}/api/v4/groups"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ gitlab_pat }}"
    body_format: json
    body:
      name: "{{ configuration.gitlab.group }}"
      path: "{{ configuration.gitlab.group }}"
      visibility: internal
    status_code: [200, 201]
    validate_certs: false
  register: gitlab_group
  ignore_errors: true

- name: Get existing GitLab group (if create returned conflict)
  ansible.builtin.uri:
    url: "https://{{ gitlab_host }}/api/v4/groups/{{ configuration.gitlab.group }}"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ gitlab_pat }}"
    validate_certs: false
  register: gitlab_group_existing
  when: gitlab_group is failed

- name: Set group ID fact
  ansible.builtin.set_fact:
    gitlab_group_id: "{{ (gitlab_group.json.id | default(gitlab_group_existing.json.id)) }}"

- name: Create GitLab projects
  ansible.builtin.uri:
    url: "https://{{ gitlab_host }}/api/v4/projects"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ gitlab_pat }}"
    body_format: json
    body:
      name: "{{ item }}"
      path: "{{ item }}"
      namespace_id: "{{ gitlab_group_id }}"
      visibility: internal
      initialize_with_readme: false
    status_code: [200, 201]
    validate_certs: false
  loop:
    - "{{ configuration.gitlab.project }}"
    - "{{ configuration.gitlab.submodule_project }}"
  ignore_errors: true

# --- Render the GitOps patches before publishing, so the pushed tree agrees
# --- with what this playbook applies locally

- name: Template GitOps patches with GitLab credentials
  ansible.builtin.template:
    src: "configuration/{{ item.src }}"
    dest: "{{ config_stage_dir }}/{{ item.dest }}"
    mode: "0644"
  vars:
    configuration: >-
      {{ configuration | combine({
        'gitops': {
          'repo_url': gitlab_repo_url,
          'branch': configuration.gitops.branch,
          'git_username': 'root',
          'git_password': gitlab_pat
        }
      }, recursive=True) }}
  loop:
    - src: gitops-init-argocd-app.yaml.j2
      dest: overlays/gitops/init-argocd-app.yaml
    - src: gitops-ztp-repo-secret-patch.yaml.j2
      dest: overlays/gitops/ztp-repo-secret-patch.yaml
  loop_control:
    label: "{{ item.dest | basename }}"
  no_log: true

# --- Publish to GitLab ---

# The superproject push only carries gitlinks, so every pinned commit has to
# exist in the mirror before ArgoCD checks it out, and has to be reachable
# from an advertised ref or the repo-server cannot fetch it at all. Name the
# refs after the SHA: that keeps the push append-only, so bumping the
# submodule never invalidates an older pin you might roll back to, and no
# branch name has to be tracked in vars.yaml.
- name: Mirror the pinned telco-reference commits into GitLab
  ansible.builtin.shell: |
    set -eu
    mirror="https://root:{{ gitlab_pat }}@{{ gitlab_host }}/{{ configuration.gitlab.group }}/{{ configuration.gitlab.submodule_project }}.git"
    # Not named 'path': that is a special variable in some shells.
    sm_paths="$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}')"

    for sha in $(git ls-tree -r HEAD | awk '$2 == "commit" { print $3 }' | sort -u); do
      src=""
      for sm in $sm_paths; do
        if [ -e "$sm/.git" ] && git -C "$sm" cat-file -e "${sha}^{commit}" 2>/dev/null; then
          src="$sm"
          break
        fi
      done
      if [ -z "$src" ]; then
        echo "no submodule checkout contains pinned commit $sha" >&2
        echo "run 'git submodule update --init --recursive' in {{ repo_root }}" >&2
        exit 1
      fi
      GIT_SSL_NO_VERIFY=true git -C "$src" push "$mirror" "$sha:refs/heads/pin/$sha"
    done
  args:
    chdir: "{{ repo_root }}"
  no_log: true

- name: Create a throwaway worktree for the GitLab push
  ansible.builtin.shell: |
    set -eu
    worktree={{ gitlab_push_worktree | quote }}
    git worktree remove --force "$worktree" 2>/dev/null || true
    rm -rf "$worktree"
    git worktree prune
    git worktree add --detach --no-checkout "$worktree" HEAD
    git -C "$worktree" checkout --no-recurse-submodules HEAD -- .
  args:
    chdir: "{{ repo_root }}"

# ArgoCD syncs the same path this playbook applies with 'oc apply -k', but the
# ArgoCD syncs the same path this playbook applies with 'oc apply -k', but
# the committed overlays hold example values from another cluster -- a
# repoURL hub-config would use to overwrite its own source, a Keycloak
# hostname belonging to a different hub. Publish the rendered versions so
# both paths converge on the same manifests.
#
# Which files those are is discovered rather than listed. stage_config seeds
# the staging area with cp -rL, so any file that now differs from the
# committed tree was rendered or rewritten by some role along the way --
# whether that was stage_config, keycloak, gitlab or anything added later. A
# hand-maintained list only covered what stage_config itself rendered, so a
# role templating into the tree on its own published the example instead,
# and nothing failed to say so.
#
# reference-crs and telco-reference are excluded: both resolve into the
# submodule, which is a symlink and a gitlink in the published tree rather
# than files this push can write.
- name: Find staged files that differ from the committed tree
  ansible.builtin.shell: |
    set -eu
    cd {{ config_stage_dir | quote }}
    find . -type f \( -name '*.yaml' -o -name '*.yml' -o -name '*.json' \) \
      ! -path './reference-crs/*' ! -path './telco-reference/*' -print |
    while IFS= read -r f; do
      cmp -s "$f" {{ config_src_dir | quote }}/"${f#./}" || printf '%s\n' "${f#./}"
    done
  register: staged_diff
  changed_when: false

- name: Publish the rendered configuration instead of the committed examples
  ansible.builtin.copy:
    src: "{{ config_stage_dir }}/{{ item }}"
    dest: "{{ gitlab_push_worktree }}/{{ config_rel_dir }}/{{ item }}"
    mode: "0644"
    remote_src: true
  loop: "{{ staged_diff.stdout_lines }}"
  loop_control:
    label: "{{ item }}"

# The commit reuses HEAD's author and committer dates, so an unchanged tree
# re-renders the same SHA and ArgoCD does not see a new revision -- and
# resync -- on every playbook run. The branch keys come out because the
# mirror carries pin/<sha> refs rather than upstream's branch names.
- name: Point the submodules at the GitLab mirror and push
  ansible.builtin.shell: |
    set -eu
    worktree={{ gitlab_push_worktree | quote }}

    for key in $(git -C "$worktree" config -f .gitmodules --name-only --get-regexp '^submodule\..*\.url$'); do
      git -C "$worktree" config -f .gitmodules "$key" {{ gitlab_submodule_repo_url | quote }}
    done
    for key in $(git -C "$worktree" config -f .gitmodules --name-only --get-regexp '^submodule\..*\.branch$'); do
      git -C "$worktree" config -f .gitmodules --unset "$key"
    done
    git -C "$worktree" add -A

    GIT_AUTHOR_DATE="$(git -C "$worktree" log -1 --format=%aI HEAD)" \
    GIT_COMMITTER_DATE="$(git -C "$worktree" log -1 --format=%cI HEAD)" \
    git -C "$worktree" \
      -c user.name="tnc-automation" \
      -c user.email="tnc-automation@{{ gitlab_host }}" \
      commit --quiet -m "Rendered configuration for {{ cluster.name }}.{{ cluster.base_domain }}"

    GIT_SSL_NO_VERIFY=true git -C "$worktree" push --force \
      "https://root:{{ gitlab_pat }}@{{ gitlab_host }}/{{ configuration.gitlab.group }}/{{ configuration.gitlab.project }}.git" \
      HEAD:refs/heads/{{ configuration.gitops.branch }}

    git worktree remove --force "$worktree"
  args:
    chdir: "{{ repo_root }}"
  no_log: true

- name: GitLab ready
  ansible.builtin.debug:
    msg:
      - "GitLab: https://{{ gitlab_host }}"
      - "Repo: {{ gitlab_repo_url }} ({{ configuration.gitops.branch }})"
      - "Submodule mirror: {{ gitlab_submodule_repo_url }}"
      - "Rendered files published: {{ staged_diff.stdout_lines | length }}"

# --- Restore from backup if available ---

- name: Check and restore GitLab from backup
  ansible.builtin.include_tasks: restore.yaml

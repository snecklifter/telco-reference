---
# --- MetalLB ---

- name: Render MetalLB manifests
  ansible.builtin.template:
    src: "configuration/{{ item.src }}"
    dest: "{{ config_stage_dir }}/{{ item.dest }}"
    mode: "0644"
  loop:
    - src: metallb.yaml.j2
      dest: metallb.yaml
    - src: metallb-config.yaml.j2
      dest: metallb-config.yaml
  loop_control:
    label: "{{ item.dest }}"

- name: Install MetalLB operator
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    apply -f {{ config_stage_dir }}/metallb.yaml

- name: Wait for MetalLB operator
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n metallb-system get subscriptions.operators.coreos.com
    metallb-operator -o jsonpath='{.status.state}'
  register: metallb_state
  until: metallb_state.stdout == "AtLatestKnown"
  retries: 30
  delay: 20
  changed_when: false

- name: Wait for MetalLB CRD
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    get crd metallbs.metallb.io
  register: metallb_crd
  until: metallb_crd.rc == 0
  retries: 30
  delay: 10
  changed_when: false

- name: Wait for MetalLB webhook to be ready
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n metallb-system get deployment metallb-operator-webhook-server
  register: metallb_webhook
  until: metallb_webhook.rc == 0
  retries: 30
  delay: 10
  changed_when: false

- name: Wait for MetalLB webhook deployment to be available
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n metallb-system wait --for=condition=Available
    deployment/metallb-operator-webhook-server --timeout=300s
  changed_when: false

- name: Create MetalLB instance and address pool
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    apply -f {{ config_stage_dir }}/metallb-config.yaml

- name: Wait for MetalLB controller deployment to exist
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n metallb-system get deployment controller
  register: metallb_deploy
  until: metallb_deploy.rc == 0
  retries: 30
  delay: 10
  changed_when: false

- name: Wait for MetalLB controller to be ready
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n metallb-system wait --for=condition=Available
    deployment/controller --timeout=300s
  changed_when: false

# --- LSO ---

- name: Install LSO operator
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }} apply
    -f {{ config_stage_dir }}/reference-crs/optional/lso/lsoNS.yaml
    -f {{ config_stage_dir }}/reference-crs/optional/lso/lsoOperatorGroup.yaml
    -f {{ config_stage_dir }}/reference-crs/optional/lso/lsoSubscription.yaml
  when: "'lso' in configuration.components"

- name: Wait for LSO operator
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n openshift-local-storage get subscriptions.operators.coreos.com
    local-storage-operator -o jsonpath='{.status.state}'
  register: lso_state
  until: lso_state.stdout == "AtLatestKnown"
  retries: 30
  delay: 20
  changed_when: false
  when: "'lso' in configuration.components"

- name: Wait for LocalVolume CRD
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    get crd localvolumes.local.storage.openshift.io
  register: lso_crd
  until: lso_crd.rc == 0
  retries: 30
  delay: 10
  changed_when: false
  when: "'lso' in configuration.components"

- name: Apply LSO overlay (LocalVolume with disk paths)
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    apply -k {{ config_stage_dir }}/overlays/lso/
  when: "'lso' in configuration.components"

- name: Install ODF operator
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }} apply
    -f {{ config_stage_dir }}/reference-crs/optional/odf-internal/odfNS.yaml
    -f {{ config_stage_dir }}/reference-crs/optional/odf-internal/odfOperatorGroup.yaml
    -f {{ config_stage_dir }}/reference-crs/optional/odf-internal/odfSubscription.yaml
  when: "'odf' in configuration.components"

- name: Install ACM operator
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }} apply
    -f {{ config_stage_dir }}/reference-crs/required/acm/acmNS.yaml
    -f {{ config_stage_dir }}/reference-crs/required/acm/acmOperGroup.yaml
    -f {{ config_stage_dir }}/reference-crs/required/acm/acmSubscription.yaml
  when: "'acm' in configuration.components"

- name: Wait for ODF operator
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n openshift-storage get subscriptions.operators.coreos.com
    odf-operator -o jsonpath='{.status.state}'
  register: odf_state
  until: odf_state.stdout == "AtLatestKnown"
  retries: 30
  delay: 20
  changed_when: false
  when: "'odf' in configuration.components"

- name: Wait for ACM operator
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n open-cluster-management get subscriptions.operators.coreos.com
    open-cluster-management-subscription -o jsonpath='{.status.state}'
  register: acm_state
  until: acm_state.stdout == "AtLatestKnown"
  retries: 30
  delay: 20
  changed_when: false
  when: "'acm' in configuration.components"

- name: Wait for MultiClusterHub CRD
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    get crd multiclusterhubs.operator.open-cluster-management.io
  register: mch_crd
  until: mch_crd.rc == 0
  retries: 30
  delay: 10
  changed_when: false
  when: "'acm' in configuration.components"

- name: Create MultiClusterHub
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    apply -f {{ config_stage_dir }}/reference-crs/required/acm/acmMCH.yaml
  when: "'acm' in configuration.components"

- name: Wait for StorageCluster CRD
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    get crd storageclusters.ocs.openshift.io
  register: odf_crd
  until: odf_crd.rc == 0
  retries: 30
  delay: 10
  changed_when: false
  when: "'odf' in configuration.components"

- name: Wait for ACM Policy CRDs
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    get crd policies.policy.open-cluster-management.io
    placements.cluster.open-cluster-management.io
  register: acm_crds
  until: acm_crds.rc == 0
  retries: 60
  delay: 20
  changed_when: false
  when: "'acm' in configuration.components"

- name: Get worker node names from cluster
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    get nodes -l node-role.kubernetes.io/worker
    --no-headers -o custom-columns=NAME:.metadata.name
  register: worker_nodes
  changed_when: false
  when: "'odf' in configuration.components"

- name: Label worker nodes for ODF
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    label node {{ item }} cluster.ocs.openshift.io/openshift-storage="" --overwrite
  loop: "{{ worker_nodes.stdout_lines }}"
  when: "'odf' in configuration.components"

- name: Create hub-policies namespace for ACM policies
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    apply -f {{ config_stage_dir }}/reference-crs/required/gitops/addPluginsPolicyNS.yaml
  when: "'acm' in configuration.components"

- name: Apply ODF overlay (StorageCluster with patched values)
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    apply -k {{ config_stage_dir }}/overlays/odf/
  register: odf_overlay_result
  failed_when: >-
    odf_overlay_result.rc != 0 and
    'provisioner: Required value' not in odf_overlay_result.stderr
  when: "'odf' in configuration.components"

- name: Wait for StorageCluster to be ready
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n openshift-storage get storagecluster ocs-storagecluster
    -o jsonpath='{.status.phase}'
  register: sc_phase
  until: sc_phase.stdout == "Ready"
  retries: 60
  delay: 30
  changed_when: false
  when: "'odf' in configuration.components"

- name: Set default StorageClass annotation
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    apply -k {{ config_stage_dir }}/overlays/odf/
  when:
    - "'odf' in configuration.components"
    - odf_overlay_result.rc != 0

- name: Check Ceph cluster health
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n openshift-storage get cephcluster ocs-storagecluster-cephcluster
    -o jsonpath='{.status.ceph.health}'
  register: ceph_health
  until: ceph_health.stdout == "HEALTH_OK"
  retries: 60
  delay: 30
  changed_when: false
  when: "'odf' in configuration.components"

- name: Calculate expected OSD count
  ansible.builtin.set_fact:
    expected_osds: "{{ (worker_nodes.stdout_lines | length) * (configuration.odf.disk_paths | length) }}"
  when: "'odf' in configuration.components"

- name: Wait for all OSD pods to be running
  ansible.builtin.shell: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n openshift-storage get pods -l app=rook-ceph-osd
    --no-headers --field-selector=status.phase=Running | wc -l
  register: osd_running
  until: (osd_running.stdout | trim | int) == (expected_osds | int)
  retries: 60
  delay: 30
  changed_when: false
  when: "'odf' in configuration.components"

- name: ODF storage healthy
  ansible.builtin.debug:
    msg: >-
      ODF healthy: {{ osd_running.stdout | trim }} OSDs across
      {{ worker_nodes.stdout_lines | length }} workers, Ceph {{ ceph_health.stdout }}
  when: "'odf' in configuration.components"

# --- OpenShift Virtualization (CNV) ---

- name: Install OpenShift Virtualization operator
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }} apply
    -f {{ config_stage_dir }}/other-crs/optional/cnv/CnvNS.yaml
    -f {{ config_stage_dir }}/other-crs/optional/cnv/CnvOperGroup.yaml
    -f {{ config_stage_dir }}/other-crs/optional/cnv/CnvSubscription.yaml
  when: "'cnv' in configuration.components"

- name: Wait for CNV install plan
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n openshift-cnv get installplan
    -o jsonpath='{.items[0].metadata.name}'
  register: cnv_installplan
  until: cnv_installplan.rc == 0 and cnv_installplan.stdout | length > 0
  retries: 30
  delay: 10
  changed_when: false
  when: "'cnv' in configuration.components"

- name: Approve CNV install plan
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n openshift-cnv patch installplan {{ cnv_installplan.stdout }}
    --type merge -p '{"spec":{"approved":true}}'
  when: "'cnv' in configuration.components"

- name: Wait for CNV operator
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n openshift-cnv get subscriptions.operators.coreos.com
    hco-operatorhub -o jsonpath='{.status.state}'
  register: cnv_state
  until: cnv_state.stdout == "AtLatestKnown"
  retries: 30
  delay: 20
  changed_when: false
  when: "'cnv' in configuration.components"

- name: Wait for HyperConverged CRD
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    get crd hyperconvergeds.hco.kubevirt.io
  register: hco_crd
  until: hco_crd.rc == 0
  retries: 30
  delay: 10
  changed_when: false
  when: "'cnv' in configuration.components"

# --- Cluster Logging ---

- name: Install Cluster Logging operator
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }} apply
    -f {{ config_stage_dir }}/reference-crs/optional/logging/clusterLogNS.yaml
    -f {{ config_stage_dir }}/reference-crs/optional/logging/clusterLogOperGroup.yaml
    -f {{ config_stage_dir }}/reference-crs/optional/logging/clusterLogSubscription.yaml
  when: "'logging' in configuration.components"

- name: Wait for Cluster Logging operator
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n openshift-logging get subscriptions.operators.coreos.com
    cluster-logging -o jsonpath='{.status.state}'
  register: logging_state
  until: logging_state.stdout == "AtLatestKnown"
  retries: 30
  delay: 20
  changed_when: false
  when: "'logging' in configuration.components"

- name: Wait for ClusterLogForwarder CRD
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    get crd clusterlogforwarders.observability.openshift.io
  register: clf_crd
  until: clf_crd.rc == 0
  retries: 30
  delay: 10
  changed_when: false
  when: "'logging' in configuration.components"


---
- name: Clean staging area
  ansible.builtin.file:
    path: "{{ config_stage_dir }}"
    state: absent

- name: Copy configuration tree to staging area (dereference symlinks)
  ansible.builtin.command: cp -rL {{ config_src_dir }} {{ config_stage_dir }}

- name: Template overlay patches from vars.yaml
  ansible.builtin.template:
    src: "configuration/{{ item.src }}"
    dest: "{{ config_stage_dir }}/{{ item.dest }}"
    mode: "0644"
  loop:
    - src: kustomization.yaml.j2
      dest: kustomization.yaml
      component: _always
    - src: lso-local-storage-disks-patch.yaml.j2
      dest: overlays/lso/local-storage-disks-patch.yaml
      component: lso
    - src: odf-options-storage-cluster.yaml.j2
      dest: overlays/odf/options-storage-cluster.yaml
      component: odf
    - src: odf-default-storage-class-patch.yaml.j2
      dest: overlays/odf/OdfDefaultStorageClass-patch.yaml
      component: odf
    - src: acm-agentserviceconfig-patch.yaml.j2
      dest: overlays/acm/options-agentserviceconfig-patch.yaml
      component: acm
    - src: acm-storage-mco-patch.yaml.j2
      dest: overlays/acm/storage-mco-patch.yaml
      component: acm
    - src: vault-clustersecretstore-patch.yaml.j2
      dest: overlays/vault/ClusterSecretStore-patch.yaml
      component: vault
    - src: vault-ca-patch.yaml.j2
      dest: overlays/vault/VaultCertificate-ca-patch.yaml
      component: vault
    - src: quay-secret-patch.yaml.j2
      dest: overlays/quay/quay_secret-patch.yaml
      component: quay
      requires: vault
  loop_control:
    label: "{{ item.dest | basename }}"
  when: >-
    (item.component == '_always' or item.component in configuration.components)
    and (item.requires | default('') == '' or item.requires in configuration.components)

- name: Find all YAML files in staging area reference-crs and other-crs
  ansible.builtin.find:
    paths:
      - "{{ config_stage_dir }}/reference-crs/optional"
      - "{{ config_stage_dir }}/reference-crs/required"
      - "{{ config_stage_dir }}/other-crs/optional"
    patterns: '*.yaml'
    recurse: true
  register: reference_crs_files

- name: Fix catalog source references for connected deployment
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: 'redhat-operators-disconnected'
    replace: "{{ configuration.catalog_source }}"
  loop: "{{ reference_crs_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Find Subscription files for channel overrides
  ansible.builtin.find:
    paths:
      - "{{ config_stage_dir }}/reference-crs/optional"
      - "{{ config_stage_dir }}/reference-crs/required"
      - "{{ config_stage_dir }}/other-crs/optional"
    patterns: '*Subscription.yaml'
    recurse: true
  register: subscription_files
  when: configuration.channel_overrides is defined

- name: Read operator package name from each Subscription
  ansible.builtin.command: >
    python3 -c "import yaml; print(yaml.safe_load(open('{{ item.path }}'))['spec']['name'])"
  register: subscription_names
  loop: "{{ subscription_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  changed_when: false
  when: configuration.channel_overrides is defined

- name: Fix subscription channels for connected deployment
  ansible.builtin.replace:
    path: "{{ item.item.path }}"
    regexp: 'channel: .*'
    replace: "channel: {{ configuration.channel_overrides[item.stdout] }}"
  loop: "{{ subscription_names.results | default([]) }}"
  loop_control:
    label: "{{ item.item.path | basename }}"
  when:
    - configuration.channel_overrides is defined
    - item.stdout in configuration.channel_overrides

---
# The build directory is created by the manifests role, which only runs in the
# install play. Create it here too so the configure play can run on its own
# against an already-installed cluster.
- name: Ensure build directory exists
  ansible.builtin.file:
    path: "{{ build_dir }}"
    state: directory
    mode: "0755"

- name: Clean staging area
  ansible.builtin.file:
    path: "{{ config_stage_dir }}"
    state: absent

# cp -rL dereferences symlinks, and reference-crs points into the
# telco-reference submodule. An uninitialised submodule leaves it dangling and
# the copy fails on a stat error that says nothing about submodules.
- name: Check that the telco-reference submodule is checked out
  ansible.builtin.stat:
    path: "{{ config_src_dir }}/reference-crs/required"
  register: reference_crs

- name: Fail when the submodule is missing
  ansible.builtin.fail:
    msg: >-
      {{ config_src_dir }}/reference-crs does not resolve. The telco-reference
      submodule is not checked out — run
      'git submodule update --init --recursive' in the repository root.
  when: not reference_crs.stat.exists

- name: Copy configuration tree to staging area (dereference symlinks)
  ansible.builtin.command: cp -rL {{ config_src_dir }} {{ config_stage_dir }}

- name: Template overlay patches from vars.yaml
  ansible.builtin.template:
    src: "configuration/{{ item.src }}"
    dest: "{{ config_stage_dir }}/{{ item.dest }}"
    mode: "0644"
  loop:
    - src: kustomization.yaml.j2
      dest: kustomization.yaml
      component: _always
    - src: lso-local-storage-disks-patch.yaml.j2
      dest: overlays/lso/local-storage-disks-patch.yaml
      component: lso
    - src: odf-options-storage-cluster.yaml.j2
      dest: overlays/odf/options-storage-cluster.yaml
      component: odf
    - src: odf-default-storage-class-patch.yaml.j2
      dest: overlays/odf/OdfDefaultStorageClass-patch.yaml
      component: odf
    - src: acm-agentserviceconfig-patch.yaml.j2
      dest: overlays/acm/options-agentserviceconfig-patch.yaml
      component: acm
    - src: acm-storage-mco-patch.yaml.j2
      dest: overlays/acm/storage-mco-patch.yaml
      component: acm
    - src: vault-clustersecretstore-patch.yaml.j2
      dest: overlays/vault/ClusterSecretStore-patch.yaml
      component: vault
    - src: vault-ca-patch.yaml.j2
      dest: overlays/vault/VaultCertificate-ca-patch.yaml
      component: vault
    - src: quay-secret-patch.yaml.j2
      dest: overlays/quay/quay_secret-patch.yaml
      component: quay
      requires: vault
    # App-of-apps for the Helm-based add-ons. The Applications and their
    # values files both carry cluster-specific values, so all of them are
    # rendered here and published rather than committed.
    - src: hub-add-ons-app.yaml.j2
      dest: other-crs/optional/hub-add-ons/hub-add-ons-app.yaml
      component: hub-add-ons
    - src: add-ons-vault-app.yaml.j2
      dest: add-ons/vault-app.yaml
      component: hub-add-ons
    - src: add-ons-vault-values.yaml.j2
      dest: add-ons/values/vault-values.yaml
      component: hub-add-ons
    - src: add-ons-netbox-app.yaml.j2
      dest: add-ons/netbox-app.yaml
      component: hub-add-ons
    - src: add-ons-netbox-values.yaml.j2
      dest: add-ons/values/netbox-values.yaml
      component: hub-add-ons
    - src: netbox-keycloak-externalsecret.yaml.j2
      dest: add-ons/netbox-keycloak-externalsecret.yaml
      component: hub-add-ons
    - src: gitops-ztp-plugins.yaml.j2
      dest: overlays/gitops/ztp-plugins.yaml
      component: gitops
    # Keycloak's declarative surface. The keycloak role renders these same
    # templates to the same paths when it bootstraps, so there is one copy
    # rather than two that can drift.
    - src: keycloak-namespace.yaml.j2
      dest: other-crs/optional/keycloak/keycloak-namespace.yaml
      component: keycloak
    - src: keycloak-external-secrets.yaml.j2
      dest: other-crs/optional/keycloak/keycloak-external-secrets.yaml
      component: keycloak
    - src: keycloak-cr.yaml.j2
      dest: other-crs/optional/keycloak/keycloak-cr.yaml
      component: keycloak
    - src: keycloak-route.yaml.j2
      dest: other-crs/optional/keycloak/keycloak-route.yaml
      component: keycloak
    # No requires: certmanager here -- certmanager is a role that always
    # runs, not a component, so the guard would never be satisfied and this
    # would silently fall back to the committed example hostname.
    - src: keycloak-certificate.yaml.j2
      dest: other-crs/optional/keycloak/keycloak-certificate.yaml
      component: keycloak
    - src: keycloak-cnpg-cluster.yaml.j2
      dest: other-crs/optional/keycloak/keycloak-cnpg-cluster.yaml
      component: keycloak
  loop_control:
    label: "{{ item.dest | basename }}"
  when: >-
    (item.component == '_always' or item.component in configuration.components)
    and (item.requires | default('') == '' or item.requires in configuration.components)

# No list of rendered files is kept here. The gitlab role works out what to
# publish by comparing the staging area against the committed tree, which
# also catches files rendered by other roles -- a list built here covered
# only this loop, and anything templating into the tree elsewhere silently
# published the committed example instead.

- name: Find all YAML files in staging area reference-crs and other-crs
  ansible.builtin.find:
    paths:
      - "{{ config_stage_dir }}/reference-crs/optional"
      - "{{ config_stage_dir }}/reference-crs/required"
      - "{{ config_stage_dir }}/other-crs/optional"
    patterns: '*.yaml'
    recurse: true
  register: reference_crs_files

- name: Fix catalog source references for connected deployment
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: 'redhat-operators-disconnected'
    replace: "{{ configuration.catalog_source }}"
  loop: "{{ reference_crs_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Find Subscription files for channel overrides
  ansible.builtin.find:
    paths:
      - "{{ config_stage_dir }}/reference-crs/optional"
      - "{{ config_stage_dir }}/reference-crs/required"
      - "{{ config_stage_dir }}/other-crs/optional"
    patterns: '*Subscription.yaml'
    recurse: true
  register: subscription_files
  when: configuration.channel_overrides is defined

- name: Read operator package name from each Subscription
  ansible.builtin.command: >
    python3 -c "import yaml; print(yaml.safe_load(open('{{ item.path }}'))['spec']['name'])"
  register: subscription_names
  loop: "{{ subscription_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  changed_when: false
  when: configuration.channel_overrides is defined

- name: Fix subscription channels for connected deployment
  ansible.builtin.replace:
    path: "{{ item.item.path }}"
    regexp: 'channel: .*'
    replace: "channel: {{ configuration.channel_overrides[item.stdout] }}"
  loop: "{{ subscription_names.results | default([]) }}"
  loop_control:
    label: "{{ item.item.path | basename }}"
  when:
    - configuration.channel_overrides is defined
    - item.stdout in configuration.channel_overrides

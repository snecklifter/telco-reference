---
- name: Create DNS base directory
  ansible.builtin.file:
    path: "{{ dns_dir }}"
    state: directory
    mode: "0755"
  become: true

- name: Set DNS directory ownership
  ansible.builtin.file:
    path: "{{ dns_dir }}"
    owner: "{{ lookup('env', 'USER') }}"
    recurse: true
  become: true

- name: Create DNS subdirectories
  ansible.builtin.file:
    path: "{{ dns_dir }}/zones"
    state: directory
    mode: "0755"

- name: Generate zone file for this cluster
  ansible.builtin.template:
    src: zone.db.j2
    dest: "{{ dns_dir }}/zones/{{ cluster.name }}.{{ cluster.base_domain }}.zone"
    mode: "0644"
  register: zone_updated

- name: Generate extra zone files
  ansible.builtin.template:
    src: extra-zone.db.j2
    dest: "{{ dns_dir }}/zones/{{ item.name }}.zone"
    mode: "0644"
  loop: "{{ networking.extra_zones | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    extra_zone: "{{ item }}"
  register: extra_zones_updated

- name: Discover all zone files in zones directory
  ansible.builtin.find:
    paths: "{{ dns_dir }}/zones"
    patterns: "*.zone"
  register: zone_files_found

- name: Build zone list from discovered files
  ansible.builtin.set_fact:
    dns_zones: >-
      {{ zone_files_found.files
         | map(attribute='path')
         | map('basename')
         | map('regex_replace', '\.zone$', '')
         | list }}

- name: Generate named.conf with all discovered zones
  ansible.builtin.template:
    src: named.conf.j2
    dest: "{{ dns_dir }}/named.conf"
    mode: "0644"
  register: named_conf_updated

- name: Ensure DNS files are readable by container (UID 65532)
  ansible.builtin.file:
    path: "{{ dns_dir }}"
    mode: "a+rX"
    recurse: true

- name: Check if DNS container is running
  ansible.builtin.command: podman container inspect --format {% raw %}'{{.State.Running}}'{% endraw %} dns-server
  register: dns_container_state
  changed_when: false
  failed_when: false
  become: true

- name: Set restart flag
  ansible.builtin.set_fact:
    dns_needs_restart: "{{ dns_container_state.stdout != 'true' or zone_updated.changed or named_conf_updated.changed }}"

- name: Remove DNS container when restart needed
  ansible.builtin.command: podman rm -f dns-server
  become: true
  changed_when: true
  when: dns_needs_restart | bool and dns_container_state.rc == 0

- name: Open firewall for DNS
  ansible.posix.firewalld:
    service: dns
    permanent: true
    immediate: true
    state: enabled
  become: true

- name: Start BIND DNS container
  ansible.builtin.command: >
    podman run -d --name dns-server
    --publish 53:8053/udp --publish 53:8053/tcp
    -v {{ dns_dir }}/named.conf:/etc/named/hbird-defaults.conf:ro,Z
    -v {{ dns_dir }}/zones:/var/named/zones:ro,Z
    registry.access.redhat.com/hi/bind:latest
  become: true
  when: dns_needs_restart | bool

- name: Wait for DNS to start
  ansible.builtin.pause:
    seconds: 5
  when: dns_needs_restart | bool

- name: Verify DNS resolves api record
  ansible.builtin.command: >
    dig +short api.{{ cluster.name }}.{{ cluster.base_domain }}
    @{{ networking.dns_servers[0] }}
  register: dns_check
  changed_when: false
  failed_when: networking.api_vip not in dns_check.stdout

---
- name: Create vault namespace
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    create namespace vault --dry-run=client -o yaml
  register: vault_ns_yaml

- name: Apply vault namespace
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }} apply -f -
  args:
    stdin: "{{ vault_ns_yaml.stdout }}"

- name: Create Vault Enterprise license secret
  ansible.builtin.shell: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n vault create secret generic vault-ent-license
    --from-literal=license={{ configuration.vault.license }}
    --dry-run=client -o yaml |
    oc --kubeconfig {{ kubeconfig_path }} apply -f -
  no_log: true

- name: Add HashiCorp Helm repository
  ansible.builtin.command: helm repo add hashicorp https://helm.releases.hashicorp.com
  register: helm_repo
  changed_when: "'has been added' in helm_repo.stdout"
  failed_when: helm_repo.rc != 0 and 'already exists' not in helm_repo.stderr

- name: Update Helm repositories
  ansible.builtin.command: helm repo update hashicorp

- name: Template Vault Helm values
  ansible.builtin.template:
    src: configuration/vault-helm-values.yaml.j2
    dest: "{{ config_stage_dir }}/vault-helm-values.yaml"
    mode: "0640"

- name: Deploy Vault Enterprise via Helm
  ansible.builtin.command: >
    helm upgrade --install vault hashicorp/vault
    --namespace vault
    --kubeconfig {{ kubeconfig_path }}
    --version {{ configuration.vault.chart_version }}
    --values {{ config_stage_dir }}/vault-helm-values.yaml

- name: Template Vault Route
  ansible.builtin.template:
    src: configuration/vault-route.yaml.j2
    dest: "{{ config_stage_dir }}/vault-route.yaml"
    mode: "0644"

- name: Create Vault Route
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    apply -f {{ config_stage_dir }}/vault-route.yaml

- name: Wait for vault-0 pod to be running
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n vault get pod vault-0 -o jsonpath='{.status.phase}'
  register: vault_pod_phase
  until: vault_pod_phase.stdout == "Running"
  retries: 30
  delay: 20
  changed_when: false

# --- Initialize and unseal ---

- name: Check if Vault is initialized
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n vault exec vault-0 -- vault status -format=json
  register: vault_status
  failed_when: false
  changed_when: false

- name: Set Vault init status
  ansible.builtin.set_fact:
    vault_initialized: "{{ (vault_status.stdout | from_json).initialized | default(false) }}"
  when: vault_status.rc in [0, 1, 2]

- name: Initialize Vault
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n vault exec vault-0 -- vault operator init
    -key-shares={{ configuration.vault.key_shares }}
    -key-threshold={{ configuration.vault.key_threshold }}
    -format=json
  register: vault_init_result
  no_log: true
  when: not vault_initialized | default(false)

- name: Store unseal keys and root token as Kubernetes secret
  ansible.builtin.shell: |
    oc --kubeconfig {{ kubeconfig_path }} \
      -n vault create secret generic vault-unseal-keys \
      --from-literal=init-output='{{ vault_init_result.stdout }}' \
      --dry-run=client -o yaml | \
    oc --kubeconfig {{ kubeconfig_path }} apply -f -
  no_log: true
  when: vault_init_result is changed

- name: Set unseal keys from init output
  ansible.builtin.set_fact:
    vault_unseal_keys: "{{ (vault_init_result.stdout | from_json).unseal_keys_b64 }}"
  no_log: true
  when: vault_init_result is changed

- name: Retrieve unseal keys from existing secret
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n vault get secret vault-unseal-keys
    -o jsonpath='{.data.init-output}'
  register: vault_existing_keys
  no_log: true
  when: vault_initialized | default(false)

- name: Set unseal keys from existing secret
  ansible.builtin.set_fact:
    vault_unseal_keys: "{{ (vault_existing_keys.stdout | b64decode | from_json).unseal_keys_b64 }}"
  no_log: true
  when: vault_initialized | default(false)

- name: Unseal vault-0
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n vault exec vault-0 -- vault operator unseal {{ item }}
  loop: "{{ vault_unseal_keys[:configuration.vault.key_threshold | int] }}"
  no_log: true

- name: Wait for vault-0 to be ready
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n vault wait --for=condition=Ready pod/vault-0 --timeout=120s
  changed_when: false

- name: Unseal remaining Vault replicas
  ansible.builtin.include_tasks: unseal_replica.yaml
  loop: "{{ range(1, configuration.vault.replicas | int) | list }}"
  loop_control:
    loop_var: replica_index

# --- Configure Vault (KV engine, K8s auth, policies, seed secrets) ---

- name: Configure Vault
  ansible.builtin.include_tasks: configure.yaml

# --- External Secrets Operator ---

- name: Render ESO manifests
  ansible.builtin.template:
    src: "configuration/{{ item.src }}"
    dest: "{{ config_stage_dir }}/{{ item.dest }}"
    mode: "0644"
  loop:
    - src: eso-subscription.yaml.j2
      dest: eso-subscription.yaml
    - src: eso-config.yaml.j2
      dest: eso-config.yaml
    - src: eso-clustersecretstore.yaml.j2
      dest: eso-clustersecretstore.yaml
  loop_control:
    label: "{{ item.dest }}"

- name: Install External Secrets Operator
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    apply -f {{ config_stage_dir }}/eso-subscription.yaml

- name: Wait for ESO operator
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n external-secrets-operator get subscriptions.operators.coreos.com
    openshift-external-secrets-operator -o jsonpath='{.status.state}'
  register: eso_state
  until: eso_state.stdout == "AtLatestKnown"
  retries: 30
  delay: 20
  changed_when: false

- name: Wait for ExternalSecretsConfig CRD
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    get crd externalsecretsconfigs.operator.openshift.io
  register: esc_crd
  until: esc_crd.rc == 0
  retries: 30
  delay: 10
  changed_when: false

- name: Create ExternalSecretsConfig
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    apply -f {{ config_stage_dir }}/eso-config.yaml

- name: Wait for ExternalSecret CRD
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    get crd externalsecrets.external-secrets.io
  register: eso_crd
  until: eso_crd.rc == 0
  retries: 30
  delay: 10
  changed_when: false

- name: Wait for ClusterSecretStore CRD
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    get crd clustersecretstores.external-secrets.io
  register: css_crd
  until: css_crd.rc == 0
  retries: 30
  delay: 10
  changed_when: false

- name: Create ClusterSecretStore for Vault
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    apply -f {{ config_stage_dir }}/eso-clustersecretstore.yaml

- name: Wait for ClusterSecretStore to be ready
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    get clustersecretstore vault-backend
    -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  register: css_ready
  until: css_ready.stdout == "True"
  retries: 30
  delay: 10
  changed_when: false

- name: Vault deployment complete
  ansible.builtin.debug:
    msg:
      - "Vault Enterprise: vault.apps.{{ cluster.name }}.{{ cluster.base_domain }}"
      - "Unseal keys stored in secret vault/vault-unseal-keys"
      - "External Secrets Operator: installed"
      - "ClusterSecretStore: vault-backend"

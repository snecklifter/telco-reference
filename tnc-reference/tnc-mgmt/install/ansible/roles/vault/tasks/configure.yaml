- name: Write DNS API credentials to Vault
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n vault exec vault-0 --
    sh -c 'VAULT_TOKEN={{ vault_root_token }}
    vault kv put {{ configuration.vault.secret_path }}/certmanager/dns-credentials
    apiToken={{ configuration.certmanager.dns_provider.username }}
    apiSecret={{ configuration.certmanager.dns_provider.password }}'
  no_log: true

---
# The two values NetBox's OIDC config needs that cannot be committed: the
# Keycloak client secret and the realm's signing public key.
#
# The chart's extraConfig loads "arbitrary *.yaml keys from ConfigMaps and
# Secrets", so this renders a single keycloak.yaml key whose content is a
# NetBox config fragment, rather than one secret key per setting.
#
# Both are read from Vault. The client secret is seeded there before the
# Keycloak realm is built; the public key is written back by the keycloak
# role once the realm exists, because Keycloak generates it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-keycloak-config
  namespace: netbox
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: netbox-keycloak-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        keycloak.yaml: |
          SOCIAL_AUTH_KEYCLOAK_SECRET: "{{ .client_secret }}"
          SOCIAL_AUTH_KEYCLOAK_PUBLIC_KEY: "{{ .realm_public_key }}"
  data:
    - secretKey: client_secret
      remoteRef:
        key: ztp/mgmt1/keycloak/clients/netbox
        property: secret
    - secretKey: realm_public_key
      remoteRef:
        key: ztp/mgmt1/keycloak/realm
        property: public_key
